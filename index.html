<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ねあがりチラシ</title>
<meta name="description" content="食品と日用品の値上げを、週に一度まとめます。">
<style>
  :root {
    --paper:#FBF9F4; --red:#E8342A; --blue:#1B3A8C;
    --ink:#221F1C; --sub:#6E6863; --rule:#E0DACE; --tint:#F2EEE4;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .bar-red { height:6px; background:var(--red); }
  .bar-blue { height:2px; background:var(--blue); }
  .wrap { max-width:560px; margin:0 auto; padding:20px 16px 56px; }

  .head { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  h1 { margin:0; font-size:30px; font-weight:900; letter-spacing:.04em; line-height:1; }
  .upd { font-size:11px; color:var(--sub); white-space:nowrap; }
  .lead { margin:8px 0 0; font-size:13px; color:var(--sub); line-height:1.7; }
  .newbar {
    margin-top:12px; display:inline-block; background:var(--red); color:#fff;
    font-size:13px; font-weight:700; padding:6px 12px; border-radius:2px;
  }

  .cats { display:flex; gap:6px; flex-wrap:wrap; margin:20px 0; }
  .cat {
    font:inherit; font-size:13px; padding:6px 13px; border:1px solid var(--rule);
    background:transparent; color:var(--sub); border-radius:999px; cursor:pointer;
  }
  .cat.on { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700; }
  .cat:focus-visible, .row:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }

  section { margin-bottom:26px; }
  .daterow { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .chip {
    background:var(--ink); color:#fff; font-size:15px; font-weight:800;
    padding:3px 9px; letter-spacing:.02em;
  }
  .chip.soon { background:var(--red); }
  .when { font-size:12px; color:var(--sub); }

  .list { border-top:1px solid var(--rule); }
  .item { border-bottom:1px solid var(--rule); }
  .row {
    font:inherit; width:100%; display:flex; align-items:center; gap:12px;
    padding:12px 2px; background:none; border:none; text-align:left; cursor:pointer;
  }
  .name { display:block; font-size:16px; font-weight:700; line-height:1.4; }
  .maker { display:block; font-size:12px; color:var(--sub); margin-top:2px; }
  .rate { font-size:21px; font-weight:900; color:var(--red); white-space:nowrap; }
  .rate.soft { color:var(--sub); }
  .tag-new { font-size:10px; color:var(--red); font-weight:800; margin-left:6px; vertical-align:middle; }
  .tag-unsure {
    font-size:10px; color:var(--sub); font-weight:700; margin-left:6px;
    padding:1px 5px; border:1px solid var(--rule); border-radius:2px; vertical-align:middle;
  }
  .detail {
    background:var(--tint); padding:10px 12px 12px; margin-bottom:10px;
    font-size:13px; line-height:1.8;
  }
  .src { font-size:11px; color:var(--sub); margin-top:4px; }
  .src a { color:var(--blue); }

  .empty { font-size:14px; color:var(--sub); padding:40px 0; text-align:center; }
  .foot { font-size:11px; color:var(--sub); margin-top:34px; line-height:1.9; text-align:center; }
  .foot .box { padding:1px 5px; border:1px solid var(--rule); border-radius:2px; }
</style>
</head>
<body>

<div class="bar-red"></div>
<div class="bar-blue"></div>

<div class="wrap">
  <header>
    <div class="head">
      <h1>ねあがりチラシ</h1>
      <span class="upd" id="upd"></span>
    </div>
    <p class="lead">食品と日用品の値上げを、週に一度まとめます。</p>
    <div id="newbar"></div>
  </header>

  <div class="cats" id="cats"></div>
  <div id="body"><p class="empty">読みこんでいます…</p></div>

  <p class="foot">
    <span class="box">不確定</span> は、まだ正式に発表されていないものです。<br>
    毎週月曜に更新しています。<br>
    正確な価格は各社の発表をご確認ください。<br>
    <span style="letter-spacing:.04em">© aurorapolis</span>
  </p>
</div>

<script>
const CATS = ["すべて","食品","飲料","日用品","その他"];
const WD = ["日","月","火","水","木","金","土"];
let DATA = null, CAT = "すべて", OPEN = null;

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function parseDate(s){
  const m = String(s||"").match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
function days(d){
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}
function whenLabel(n){
  if (n < 0) return (-n) + "日前から";
  if (n === 0) return "きょうから";
  if (n === 1) return "あした";
  return "あと" + n + "日";
}

function items(){
  if (!DATA) return [];
  return (DATA.items || [])
    .map(r => Object.assign({}, r, { d: parseDate(r.date) }))
    .filter(r => r.d && r.item && days(r.d) >= -7)
    .sort((a,b) => a.d - b.d);
}

function render(){
  const all = items();

  const u = parseDate(DATA && DATA.updated);
  document.getElementById("upd").textContent =
    u ? (u.getMonth()+1) + "月" + u.getDate() + "日 しらべ" : "";

  const n = all.filter(r => r.first_seen === (DATA && DATA.updated)).length;
  document.getElementById("newbar").innerHTML =
    n > 0 ? '<div class="newbar">新しい値上げが ' + n + ' 件</div>' : "";

  document.getElementById("cats").innerHTML = CATS.map(c =>
    '<button class="cat' + (c === CAT ? " on" : "") + '" data-cat="' + c + '">' + c + '</button>'
  ).join("");

  const shown = all.filter(r => CAT === "すべて" || r.cat === CAT);
  const body = document.getElementById("body");

  if (!shown.length){
    body.innerHTML = '<p class="empty">このカテゴリの値上げは、いまのところありません。</p>';
    return;
  }

  const groups = new Map();
  shown.forEach(r => {
    if (!groups.has(r.date)) groups.set(r.date, []);
    groups.get(r.date).push(r);
  });

  let html = "";
  groups.forEach((rows, date) => {
    const d = parseDate(date), k = days(d);
    html += '<section><div class="daterow">'
      + '<span class="chip' + (k <= 7 ? " soon" : "") + '">'
      + (d.getMonth()+1) + "/" + d.getDate() + '</span>'
      + '<span class="when">' + WD[d.getDay()] + "曜　" + whenLabel(k) + '</span>'
      + '</div><div class="list">';

    rows.forEach((r, i) => {
      const id = date + "-" + i;
      const isNew = r.first_seen === DATA.updated;
      const unsure = r.sure === false;
      html += '<div class="item"><button class="row" data-id="' + id + '">'
        + '<span style="flex:1;min-width:0">'
        + '<span class="name">' + esc(r.item)
        + (isNew ? '<span class="tag-new">NEW</span>' : "")
        + (unsure ? '<span class="tag-unsure">不確定</span>' : "")
        + '</span><span class="maker">' + esc(r.maker) + '</span></span>'
        + '<span class="rate' + (unsure ? " soft" : "") + '">'
        + esc(r.rate) + (unsure ? "?" : "") + '</span></button>';

      if (OPEN === id){
        html += '<div class="detail">' + esc(r.note)
          + '<div class="src">出典 ' + esc(r.src)
          + (r.url ? '　<a href="' + esc(r.url) + '" target="_blank" rel="noreferrer">記事を読む</a>' : "")
          + '</div></div>';
      }
      html += '</div>';
    });
    html += '</div></section>';
  });
  body.innerHTML = html;
}

document.addEventListener("click", e => {
  const c = e.target.closest(".cat");
  if (c){ CAT = c.dataset.cat; OPEN = null; render(); return; }
  const r = e.target.closest(".row");
  if (r){ OPEN = (OPEN === r.dataset.id) ? null : r.dataset.id; render(); }
});

fetch("data.json?" + Date.now())
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(j => { DATA = j; render(); })
  .catch(() => {
    document.getElementById("body").innerHTML =
      '<p class="empty">data.json が読みこめませんでした。<br>ファイルの書き方を確認してください。</p>';
  });
</script>
</body>
</html>
