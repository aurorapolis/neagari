<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ねあがりチラシ</title>
<meta name="description" content="食品と日用品の値上げを、ほぼだいたいたぶん毎日まとめます。">
<!-- リンクカード(note・Xなど)用 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="ねあがりチラシ">
<meta property="og:title" content="ねあがりチラシ">
<meta property="og:description" content="食品と日用品の値上げを、ほぼだいたいたぶん毎日まとめます。">
<meta property="og:image" content="https://aurorapolis.github.io/neagari/ogp-1.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://aurorapolis.github.io/neagari/">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://aurorapolis.github.io/neagari/ogp-1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#F1EBD9; --teal:#1C8792; --teal-d:#0F5C65; --red:#DE4527;
    --ink:#2A2622; --sub:#7C7264; --line:#D6CDB6;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; color:var(--ink);
    background:
      radial-gradient(circle at 1px 1px, rgba(90,70,40,.07) 1px, transparent 0) 0 0/6px 6px,
      var(--paper);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .min {
    font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
    font-weight:800;
  }
  .dot {
    font-family:"DotGothic16","Hiragino Kaku Gothic ProN",monospace; font-weight:400;
    -webkit-font-smoothing:none;
  }
  .wrap { max-width:560px; margin:0 auto; padding:0 14px 62px; }

  /* ── 見出し ── */
  .masthead {
    position:relative; background:var(--teal); color:#fff; overflow:hidden;
    margin:0 -14px; padding:24px 16px 14px; border-bottom:5px solid var(--ink);
  }
  .rays {
    position:absolute; inset:-60% -30%; z-index:0; opacity:.85;
    background:repeating-conic-gradient(from 0deg at 50% 42%,
      rgba(255,255,255,.11) 0deg 5deg, rgba(255,255,255,0) 5deg 11deg);
  }
  h1 {
    margin:0; position:relative; z-index:2;
    font-size:clamp(30px,11vw,46px); line-height:1.08; letter-spacing:-.045em;
    color:var(--red); transform-origin:left center;
    transform:perspective(360px) rotateY(-17deg) rotate(-1.2deg);
    -webkit-text-stroke:7px var(--paper);
    paint-order:stroke fill;
    text-shadow:5px 5px 0 rgba(0,0,0,.3);
  }
  .lead {
    margin:18px 0 0; font-size:11.5px; font-weight:700; line-height:1.7;
    position:relative; z-index:1;
  }
  .metarow {
    display:flex; align-items:center; gap:12px;
    margin-top:16px; position:relative; z-index:1;
  }
  .upd:empty { display:none; }
  .upd {
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--paper); color:var(--teal-d);
    font-size:10px; padding:4px 9px; letter-spacing:.03em; flex:none;
  }
  .badge {
    position:absolute; left:2px; top:3px; z-index:1;
    width:28px; height:28px; border-radius:50%;
    background:var(--red);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:9.5px; line-height:1.08; text-align:center;
    letter-spacing:.02em;
    box-shadow:
      inset 0 0 0 1px var(--red),
      inset 0 0 0 2px rgba(255,255,255,.9),
      2px 2px 0 rgba(0,0,0,.2);
  }
  .newbar {
    position:relative;
    background:var(--red); color:#fff; margin:0 -14px;
    display:flex; align-items:center; justify-content:center; gap:12px;
    padding:9px 64px 9px 16px; border-bottom:4px solid var(--ink);
  }
  .bar-chara {
    position:absolute; right:6px; bottom:0; width:56px; height:auto;
    image-rendering:pixelated; pointer-events:none;
  }
  .nb-left { font-size:17px; letter-spacing:.06em; }

  /* ── ねあがりニュース（広告ではない、ふつうのお知らせ欄） ── */
  .news {
    position:relative; margin:68px 0 0; background:#FFFDF6;
    border:2px solid var(--ink); padding:28px 11px 10px;
    box-shadow:3px 3px 0 rgba(42,38,34,.75);
  }
  /* 見出し：朱赤のハンコ。少し傾けて、ぺたっと押した感じ */
  .news-stamp {
    position:absolute; left:-6px; top:-17px;
    background:var(--red); color:#fff; font-size:16px; letter-spacing:.08em;
    padding:4px 12px 5px; transform:rotate(-2.5deg);
    box-shadow:
      inset 0 0 0 1.5px var(--red),
      inset 0 0 0 3px rgba(255,255,255,.9),
      3px 3px 0 var(--ink);
  }
  /* 月ちゃんが枠の上から、ていねいにご案内 */
  .news-by {
    position:absolute; right:4px; bottom:100%; margin-bottom:-6px;
    display:flex; align-items:flex-end; gap:10px; pointer-events:none;
  }
  .news-by img { width:46px; height:auto; image-rendering:pixelated; display:block; }
  .news-bubble {
    position:relative; margin-bottom:28px;
    background:#fff; border:2px solid var(--ink); border-radius:16px;
    padding:5px 11px 6px; font-size:11.5px; font-weight:800; line-height:1.45; color:var(--ink);
    white-space:nowrap;
  }
  /* しっぽ：外側の黒い三角に、内側の白い三角を重ねる */
  .news-bubble::before, .news-bubble::after {
    content:""; position:absolute; top:55%; border-style:solid; border-color:transparent;
  }
  .news-bubble::before { right:-12px; margin-top:-7px; border-width:7px 0 7px 12px; border-left-color:var(--ink); }
  .news-bubble::after  { right:-8.5px; margin-top:-5px; border-width:5px 0 5px 9px; border-left-color:#fff; }
  .news-bubble b { color:var(--teal-d); }
  .news-item + .news-item { border-top:1.5px dashed var(--line); margin-top:8px; padding-top:8px; }
  .news-row { display:flex; align-items:center; gap:7px; }
  .news-tag {
    flex:none; background:var(--teal); color:#fff;
    font-size:10.5px; font-weight:800; padding:1px 6px; letter-spacing:.04em;
  }
  .news-title { font-size:16px; line-height:1.3; color:var(--red); }
  .news-body { display:block; font-size:12.5px; font-weight:600; line-height:1.6; margin-top:3px; }
  .news-src { font-size:11.5px; font-weight:700; color:var(--sub); margin-left:4px; white-space:nowrap; }
  .news-src a { color:var(--teal-d); margin-left:6px; }
  /* ニュースが0件のときの、月ちゃんのおことわり */
  .news-none { margin:2px 0 0; font-size:12.5px; font-weight:700; line-height:1.6; color:var(--sub); }

  /* ── 月ちゃんニュースのバックナンバー（期間が終わったもの・4件目からあふれたもの） ── */
  .news-arch { margin-top:10px; border-top:1.5px dashed var(--line); padding-top:9px; }
  .news-arch > summary {
    list-style:none; cursor:pointer; -webkit-tap-highlight-color:transparent;
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:800; color:var(--teal-d); letter-spacing:.04em;
    background:#fff; border:1.5px solid var(--teal); padding:5px 10px;
    box-shadow:2px 2px 0 rgba(42,38,34,.6);
  }
  .news-arch > summary::-webkit-details-marker { display:none; }
  .news-arch > summary::after { content:"▼"; font-size:10px; }
  .news-arch[open] > summary::after { content:"▲"; }
  .news-arch > summary:active { transform:translate(2px,2px); box-shadow:none; }
  .news-arch > summary:focus-visible { outline:3px solid var(--red); outline-offset:2px; }
  .na-n { font-size:11px; font-weight:700; color:var(--sub); letter-spacing:0; }
  .na-note { margin:9px 0 6px; font-size:11.5px; font-weight:700; line-height:1.6; color:var(--sub); }
  .na-list { margin:0; padding:0; list-style:none; background:#FBF8EE; border:1.5px solid var(--line); }
  .na-row { display:flex; gap:9px; padding:8px 10px; }
  .na-row + .na-row { border-top:1px dashed var(--line); }
  .na-date { flex:none; min-width:36px; font-size:12px; font-weight:700; line-height:1.75; color:var(--sub); }
  .na-main { flex:1; min-width:0; }
  .na-head { display:block; font-size:14px; line-height:1.45; color:var(--ink); }
  .na-tag {
    display:inline-block; vertical-align:2px; margin-right:6px;
    border:1.5px solid var(--teal); color:var(--teal-d);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
    font-size:10px; font-weight:800; padding:0 5px; letter-spacing:.04em;
  }
  .na-body { display:block; font-size:12px; font-weight:600; line-height:1.6; margin-top:2px; }

  /* ためし表示（?date=…）のときだけ、左下に出る札 */
  #testday {
    position:fixed; left:12px; bottom:14px; z-index:60;
    background:var(--ink); color:#fff; font-size:11.5px; font-weight:800;
    padding:5px 9px; letter-spacing:.04em; box-shadow:2px 2px 0 rgba(0,0,0,.25);
  }

  /* ── 昭和のお値段（押すとひらく箱） ── */
  .showa-box { position:relative; margin:20px 0 0; }
  .showa {
    background:#FFFDF6;
    border:3px solid var(--ink); box-shadow:3px 3px 0 rgba(42,38,34,.75);
  }
  /* 看板（新コーナーのハンコ）。月ちゃんニュースと同じ押し方 */
  .showa-box.has-stamp { margin-top:40px; }
  .has-stamp .showa summary { padding-top:20px; }
  .sw-stamp {
    position:absolute; left:-6px; top:-18px; z-index:1;
    display:flex; align-items:center; gap:8px; pointer-events:none;
  }
  /* 色は山吹色。月ちゃんニュース（朱赤）と見分けがつくように */
  .sw-stamp b {
    background:#F2B632; color:var(--ink); font-size:16px; letter-spacing:.08em;
    padding:4px 12px 5px; transform:rotate(-2.5deg);
    box-shadow:
      inset 0 0 0 1.5px #F2B632,
      inset 0 0 0 3px var(--ink),
      3px 3px 0 var(--ink);
  }
  /* 昭和のお店の貼り紙ふう「はじめました」 */
  .sw-stamp i {
    font-style:normal; background:#FFFDF6; color:var(--ink);
    font-size:11.5px; letter-spacing:.06em; padding:2px 7px;
    border:1.5px solid var(--ink); transform:rotate(3deg) translateY(2px);
  }
  .showa summary {
    list-style:none; cursor:pointer; user-select:none;
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    background:repeating-linear-gradient(90deg, #F6E5BC 0 12px, #EFD9A8 12px 24px);
  }
  .showa summary::-webkit-details-marker { display:none; }
  .showa summary:active { transform:translate(2px,2px); }
  .showa summary:focus-visible { outline:3px solid var(--red); outline-offset:2px; }
  /* 丸い窓からのぞく、夕暮れの町（16×16ドット） */
  .sw-mark {
    flex:none; width:48px; height:48px; border-radius:50%; overflow:hidden;
    border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink);
    background:#3B2A5C;
  }
  .sw-mark svg { display:block; width:100%; height:100%; }
  .sw-head { min-width:0; }
  .sw-ttl { display:block; font-size:20px; line-height:1.15; color:var(--red); letter-spacing:.02em; }
  .sw-sub { display:block; font-size:11px; font-weight:800; color:var(--sub); margin-top:2px; }
  .sw-btn {
    margin-left:auto; flex:none; white-space:nowrap;
    background:var(--teal); color:#fff; font-size:12.5px; padding:4px 9px;
    letter-spacing:.04em; box-shadow:2px 2px 0 var(--ink);
  }
  .sw-btn .c { display:none; }
  .showa[open] .sw-btn { background:var(--ink); }
  .showa[open] .sw-btn .o { display:none; }
  .showa[open] .sw-btn .c { display:inline; }
  .sw-in { border-top:2px solid var(--ink); padding:12px 12px 14px; }
  .sw-talk { display:flex; align-items:flex-end; gap:10px; }
  .sw-talk img { width:52px; height:auto; image-rendering:pixelated; flex:none; }
  .sw-talk .sw-say {
    position:relative; background:#fff; border:2px solid var(--ink); border-radius:14px;
    padding:6px 10px; font-size:12.5px; font-weight:800; line-height:1.55; margin-bottom:8px;
  }
  .sw-talk .sw-say::before {
    content:""; position:absolute; left:-11px; bottom:9px;
    border-style:solid; border-color:transparent; border-width:6px 11px 6px 0; border-right-color:var(--ink);
  }
  .sw-list { list-style:none; margin:12px 0 0; padding:0; border:2px solid var(--line); background:#FBF8EE; }
  .sw-list li { display:flex; align-items:center; gap:10px; padding:8px 10px; font-size:15px; }
  .sw-list li + li { border-top:1px dashed var(--line); }
  .sw-no { flex:none; font-size:11.5px; color:#fff; background:var(--teal-d); padding:1px 7px; letter-spacing:.04em; }
  .sw-list a { color:var(--ink); text-decoration:none; border-bottom:2px solid var(--teal); }
  .sw-note {
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-top:14px; padding:11px 12px; text-decoration:none;
    background:var(--red); color:#fff; font-size:16px; letter-spacing:.04em;
    border:2px solid var(--ink); box-shadow:3px 3px 0 var(--ink);
  }
  .sw-note:active { transform:translate(3px,3px); box-shadow:none; }
  /* 本文は1行に収め、小さい添え書きはその下の行へ（狭い画面で文字が途中で折れないように） */
  .sw-note { flex-direction:column; gap:3px; text-align:center; }
  .sw-note b { font-weight:inherit; white-space:nowrap; }
  .sw-note small { font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; font-size:11px; font-weight:700; opacity:.9; }
  .sw-note.wait { background:#FFFDF6; color:var(--sub); border-style:dashed; box-shadow:none; }
  /* aurorapolis のnoteへ：夜の店先に、ポートフォリオと同じ「営業中」の提灯が揺れる */
  .sw-shop {
    position:relative; display:flex; align-items:center; gap:14px;
    margin-top:14px; padding:10px 14px 10px 12px; text-decoration:none;
    background:var(--ink); color:var(--paper);
    border:2px solid var(--ink); box-shadow:3px 3px 0 var(--red);
    overflow:hidden; isolation:isolate;
  }
  .sw-shop:active { transform:translate(3px,3px); box-shadow:none; }
  .sw-shop:focus-visible { outline:3px solid var(--red); outline-offset:2px; }
  /* 提灯の明かりが、店先をぼんやり照らす */
  .sw-shop::before {
    content:""; position:absolute; z-index:-1; left:-24px; top:-20px; width:120px; height:120px;
    background:radial-gradient(50% 50% at 50% 50%, rgba(240,110,70,.38), transparent 70%);
    animation:shopGlow 2.8s ease-in-out infinite;
  }
  .sw-chochin { position:relative; flex:none; width:44px; height:74px; }
  .sw-chochin i { position:absolute; left:50%; top:-12px; width:2px; height:20px; background:#8a7f72; transform:translateX(-50%); }
  .sw-lantern {
    position:absolute; left:0; top:6px; overflow:visible; transform-origin:50% 0;
    animation:shopSway 3.6s ease-in-out infinite;
    filter:drop-shadow(0 0 8px rgba(240,100,70,.6)) drop-shadow(0 0 18px rgba(240,120,70,.35));
  }
  @keyframes shopSway { 0%,100% { transform:rotate(-5deg); } 50% { transform:rotate(5deg); } }
  @keyframes shopGlow { 0%,100% { opacity:.7; } 45% { opacity:1; } 55% { opacity:.85; } }
  @media (prefers-reduced-motion: reduce){ .sw-lantern, .sw-shop::before { animation:none; } }
  .sw-shop-t { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .sw-shop-t b { font-size:16px; font-weight:800; letter-spacing:.04em; white-space:nowrap; }
  /* 2行の見出し（昭和のお値段の箱のほう）は、少し小さく */
  .sw-shop-t b.two { font-size:14.5px; line-height:1.35; letter-spacing:.02em; }
  .sw-shop-t small { font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; font-size:11px; font-weight:700; color:#CFC5B2; }
  .sw-shop-go {
    margin-left:auto; flex:none; font-size:12px; color:#fff; background:var(--red);
    padding:4px 9px; letter-spacing:.04em; white-space:nowrap;
  }
  /* ねあがりちゃんの絵のすぐ下に、小さく添える */
  .sw-foot { margin:4px 0 0; font-size:11px; font-weight:700; color:var(--sub); text-align:left; }
  .sw-row {
    font:inherit; width:100%; display:flex; align-items:center; gap:10px;
    background:none; border:0; padding:0; margin:0; color:inherit; text-align:left; cursor:pointer;
  }
  .sw-row:focus-visible { outline:3px solid var(--red); outline-offset:3px; }
  .sw-go {
    margin-left:auto; flex:none; font-size:12px; color:#fff; background:var(--red);
    padding:3px 8px; letter-spacing:.04em; box-shadow:2px 2px 0 var(--ink);
  }
  .sw-row:active .sw-go { transform:translate(2px,2px); box-shadow:none; }
  /* 次号！の行（まだ中身はひみつ） */
  .sw-list li.sw-next { background:repeating-linear-gradient(135deg, rgba(242,182,50,.12) 0 6px, transparent 6px 12px); }
  .sw-no.next { background:#F2B632; color:var(--ink); }
  .sw-q { color:var(--sub); letter-spacing:.25em; }
  .sw-next .sw-go { background:var(--ink); }

  /* ── 紙面がぱっと開く（チラシを広げる） ── */
  .paper {
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
    background:rgba(42,38,34,.6);
  }
  .paper[hidden] { display:none; }
  .paper-in {
    width:100%; max-width:560px; max-height:94vh; overflow:auto;
    background:var(--paper); border:3px solid var(--ink); border-bottom:none;
    padding-bottom:18px; transform-origin:top center;
    animation:paperOpen .5s cubic-bezier(.2,.9,.3,1.15);
  }
  @keyframes paperOpen {
    0%   { transform:perspective(900px) rotateX(-75deg) translateY(40px); opacity:0; }
    100% { transform:none; opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){ .paper-in { animation:none; } }
  .paper-bar {
    position:sticky; top:0; z-index:1;
    display:flex; align-items:center; gap:8px;
    background:var(--ink); color:#fff; padding:9px 12px;
  }
  .paper-bar .no { background:var(--teal); font-size:12px; padding:1px 7px; letter-spacing:.04em; }
  .paper-bar .no.next { background:#F2B632; color:var(--ink); }
  .paper-bar .t { font-size:16px; letter-spacing:.02em; }
  .paper-close {
    margin-left:auto; font:inherit; font-size:13px; font-weight:800; cursor:pointer;
    background:var(--paper); color:var(--ink); border:0; padding:5px 10px;
  }
  .paper-img, .paper-ph {
    display:block; width:calc(100% - 24px); margin:14px auto 0; aspect-ratio:4 / 5;
    border:2px solid var(--ink); background:#FFFDF6; box-shadow:3px 3px 0 var(--ink);
  }
  .paper-img { height:auto; object-fit:contain; }
  .paper-ph {
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    border-style:dashed; text-align:center; color:var(--sub);
    background:repeating-linear-gradient(135deg, rgba(28,135,146,.05) 0 2px, transparent 2px 9px), #FFFDF6;
  }
  .paper-ph img { width:78px; height:auto; image-rendering:pixelated; }
  .paper-ph b { font-size:17px; color:var(--red); line-height:1.5; }
  .paper-ph small { font-size:11.5px; font-weight:700; line-height:1.7; }
  .paper .sw-note { margin:16px 12px 0; }
  .paper-hint { margin:8px 0 0; font-size:11px; font-weight:700; color:var(--sub); text-align:center; }

  /* ── しぼりこみ ── */
  .cats {
    display:flex; gap:5px; flex-wrap:nowrap; margin:20px 0 26px;
    overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:4px;
  }
  .cats::-webkit-scrollbar { display:none; }
  .cat {
    font:inherit; font-size:12.5px; font-weight:800; padding:6px 11px;
    flex:none; white-space:nowrap;
    border:2px solid var(--teal); background:#fff; color:var(--teal-d);
    cursor:pointer; box-shadow:3px 3px 0 rgba(42,38,34,.75);
  }
  .cat.on { background:var(--teal); color:#fff; }
  .cat.kattoku { border-color:var(--red); color:var(--red); }
  .koukoku.yure { animation:yure .6s ease 2; }
  @keyframes yure {
    0%,100% { transform:rotate(0); }

<script>
/* ══ 広告リンクの設定 ══
   アフィリエイトに登録したら、ここに自分のIDを入れるだけ。
   空のままなら、ボタンは出ません（今のまま公開しても大丈夫）。

   AMAZON  … アソシエイトのトラッキングID（例："neagari-22"）
   RAKUTEN … 楽天アフィリエイトで作ったリンクの
             「hgc/」と「/」のあいだの文字列
             （例："1a2b3c4d.5e6f7g8h.1a2b3c4d.5e6f7g8h"）

   どちらか片方だけでもOK。両方入れるとボタンが2つ並びます。 */
const AFF = {
  AMAZON:  "",
  RAKUTEN: "58342e0e.dcae8d4f.58342e0f.dfc9b8f4"
};

/* ══ 昭和のお値段の設定 ══
   note … noteのマガジン（または最新記事）のURLを入れる。
           空のままだと、ボタンは「準備中」の表示になります。
           （いまは其の一の記事。マガジンができたら、マガジンのURLに替える）
   list … 中に並べる回。["其の○", "品物", "その回のnote記事のURL", "紙面の画像ファイル名"]
           ・紙面の画像ファイル名を書くと、押したときにアプリの中で紙面がぱっと開く。
             画像は index.html と同じ場所（GitHubのリポジトリ）に置く。
           ・URLは "" でもOK（そのときは上の note のURLへ）。
           新しい回を出したら、1行ふやすだけ。
   stamp      … 箱の上に押す看板の文字。"" にすると看板は消えます。
   stampUntil … 看板を出しておく最後の日（例："2026-11-30"）。
                その日が終わると自動で消えます。"" なら出しっぱなし。
   data.json に "showa": { "note":"…", "list":[…] } を書くと、そちらが優先されます。 */
const SHOWA = {
  stamp: "新コーナー",
  stampUntil: "",
  next: "次号！",   /* 一覧のいちばん下の「次号！」。"" にすると消える */
  /* 一覧の下の赤いボタン（各回のnoteへは、紙面の中のボタンから行ける）
     magazine … noteで「昭和のお値段」のマガジンを作ったら、ここにURLを入れる。
                入れると、ボタンが「noteで ぜんぶ読む ▶」になって、マガジンへ行く。
     home     … マガジンがないあいだは、aurorapolis のnoteのトップへ行く。
                両方 "" にすると、ボタンは出ない。 */
  magazine: "",
  home: "https://note.com/aurorapolis",
  note: "https://note.com/aurorapolis/n/n40acdc120120",
  list: [
    ["其の一", "卵", "https://note.com/aurorapolis/n/n0f259fe13558", "showa-01-tamago.png"],
    ["其の二", "灯油", "https://note.com/aurorapolis/n/n40acdc120120", "showa-02-touyu.png"]
  ]
};

/* ══ ドット絵をつくる部分 ══
   16pxちょうどで文字を描き、にじみを消してから整数倍に拡大します。
   こうしないと画面がなめらかに描いてしまい、粒が見えません。 */

function dotCanvas(lines, rgb, gap){
  const size = 16, lh = size + (gap == null ? 3 : gap);
  const cv = document.createElement("canvas");
  let cx = cv.getContext("2d");
  cx.font = size + 'px "DotGothic16", monospace';
  let w = 1;
  lines.forEach(t => { w = Math.max(w, Math.ceil(cx.measureText(t).width)); });
  cv.width = w;
  cv.height = lh * lines.length;
  cx = cv.getContext("2d");
  cx.font = size + 'px "DotGothic16", monospace';
  cx.textBaseline = "top";
  cx.fillStyle = "#000";
  lines.forEach((t, i) => cx.fillText(t, 0, i * lh + 1));
  const img = cx.getImageData(0, 0, cv.width, cv.height), d = img.data;
  for (let i = 0; i < d.length; i += 4){
    if (d[i+3] > 100){ d[i]=rgb[0]; d[i+1]=rgb[1]; d[i+2]=rgb[2]; d[i+3]=255; }
    else d[i+3] = 0;
  }
  cx.putImageData(img, 0, 0);

  /* 上下の余った空白を切り落として、きっちり中心に置けるようにする */
  let top = -1, bot = -1;
  for (let y = 0; y < cv.height; y++){
    let ink = false;
    for (let x = 0; x < cv.width; x++){
      if (d[(y * cv.width + x) * 4 + 3] === 255){ ink = true; break; }
    }
    if (ink){ if (top < 0) top = y; bot = y; }
  }
  if (top < 0) return cv;
  const out = document.createElement("canvas");
  out.width = cv.width;
  out.height = bot - top + 1;
  const ox = out.getContext("2d");
  ox.imageSmoothingEnabled = false;
  ox.drawImage(cv, 0, -top);
  return out;
}

function mountDot(el, lines, rgb, avail, maxScale, gap){
  if (!el) return;
  try {
    const cv = dotCanvas(lines, rgb, gap);
    let sc = Math.floor(avail / cv.width);
    sc = Math.max(1, Math.min(maxScale || 2, sc));
    cv.style.width  = (cv.width  * sc) + "px";
    cv.style.height = (cv.height * sc) + "px";
    cv.style.imageRendering = "pixelated";
    cv.style.display = "block";
    cv.setAttribute("role", "img");
    cv.setAttribute("aria-label", lines.join(""));
    el.innerHTML = "";
    el.appendChild(cv);
  } catch(e){}
}

const LEAD = ["食品と日用品の値上げを", "ほぼだいたいたぶん毎日更新！"];
let dotReady = false;

function paintDots(){
  const head = document.querySelector(".masthead");
  const avail = head.clientWidth - 32;
  mountDot(document.getElementById("lead"), LEAD, [255,255,255], avail, 1);
  const u = document.getElementById("upd");
  if (u && u.dataset.text){
    mountDot(u, [u.dataset.text], [15,92,101], avail - 90, 1);
  }
}

const DOTREADY = (document.fonts && document.fonts.load)
  ? document.fonts.load('16px "DotGothic16"', "食品日用値上号外しらべ月日毎更新ほだたぶん！")
  : Promise.resolve();

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>

function parseDate(s){
  const m = String(s||"").match(/(\d{4})-(\d{1,2})-(\d{1,2})/);

/* ══ ためし表示（自分の確認用） ══
   アドレスの後ろに ?date=2026-11-10 を付けて開くと、その日のつもりで表示する。
   バックナンバーや「もう上がりました」の見え方を、先回りして確かめられる。
   ふつうに開いたときは関係なし。左下に黒い札が出ているあいだだけ、ためし表示。 */
const TEST_DAY = (function(){
  const m = String(location.search || "").match(/[?&]date=(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m ? new Date(+m[1], +m[2]-1, +m[3], 12) : null;
})();
function nowDate(){ return TEST_DAY ? new Date(TEST_DAY.getTime()) : new Date(); }
if (TEST_DAY){
  const t = document.createElement("div");
  t.id = "testday";
  t.textContent = "ためし表示：" + (TEST_DAY.getMonth()+1) + "月" + TEST_DAY.getDate() + "日のつもり";
  document.body.appendChild(t);
}

function days(d){
  const t = nowDate(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}
function whenLabel(n){
  if (n < 0) return (-n) + "日前から";
  if (n === 0) return "きょうから";
  if (n === 1) return "あした";
  return "あと" + n + "日";
}

function exHtml(t){
  // 末尾の「ほかにもあり！」だけ色を変える
  const m = String(t).match(/^(.*?)[、,]?\s*(ほか(?:にもあり！?|[0-9０-９]+品目))$/);
  if (m) return esc(m[1]) + '　<i>' + esc(m[2]) + '</i>';
  return esc(t);
}

/* 「buy」に書いた検索ことばから、広告リンクのボタンをつくる。
   ・「tip」があればそちらを優先（電気・ガスなど、買えないもの向け。例："節電グッズ"）
   ・発表待ちのものは、あおらないように「いちおう見ておく？」にする
   ・「その他」も、buy か tip を書いたものには出る */
function buyHtml(r, k){
  const tip = String(r.tip || "").trim();
  const kw  = tip || String(r.buy || "").trim();
  if (!kw) return "";
  const label = tip ? tip + "をのぞく"
              : r.sure === false ? "いちおう見ておく？"
              : k <= 0 ? "売り場をのぞく"
              : "いまのうちに買っとく";
  const links = [];
  if (AFF.AMAZON){
    links.push(["Amazon",
      "https://www.amazon.co.jp/s?k=" + encodeURIComponent(kw)
      + "&tag=" + encodeURIComponent(AFF.AMAZON)]);
  }
  if (AFF.RAKUTEN){
    const dest = "https://search.rakuten.co.jp/search/mall/" + encodeURIComponent(kw) + "/";
    links.push(["楽天",
      "https://hb.afl.rakuten.co.jp/hgc/" + AFF.RAKUTEN
      + "/?pc=" + encodeURIComponent(dest) + "&link_type=text"]);
  }
  if (!links.length) return "";
  return '<span class="buys">'
    + links.map(([name, url]) =>
        '<a class="buy" href="' + esc(url) + '" target="_blank" rel="sponsored noopener">'
        + label + ' <small>' + name + '</small></a>').join("")
    + '<span class="pr">広告</span></span>';
}

/* ══ 月ちゃんニュース ══
   data.json の "news" に書くと、一覧の上にお知らせとして出る（広告ではない）。
   ・from〜to の期間中のものが、新しい順に3件まで出る（NEWS_MAX）
   ・期間が終わったもの、4件目からあふれたものは、欄の下の「バックナンバー」に入る。
     data.json から消さずに残しておくだけで、自動でそうなる（消すとバックナンバーからも消える）
   ・期間中のものが1件もないときは「取材中」のひとことと、バックナンバーだけが出る
   ・バックナンバーもないときは、欄ごと出ない
   "news": [ { "from":"…", "to":"…", "tag":"北海道", "head":"見出し", "body":"本文", "src":"出典", "url":"記事のURL" } ]
   "buy" か "tip" を書くと、値上げ一覧と同じ楽天ボタン（広告つき）が出る。書かなければ出ない。
   バックナンバーには楽天ボタンは出さない。 */
const NEWS_MAX = 3;
function pickNews(){
  let list = DATA && DATA.news;
  if (!list) return { shown:[], past:[] };
  if (!Array.isArray(list)) list = [list];
  const now = nowDate();
  const at = x => { const d = new Date(x.from); return isNaN(d) ? 0 : d.getTime(); };
  const started = list
    .map((x, i) => ({ x, i }))
    .filter(o => o.x && o.x.head && (!o.x.from || now >= new Date(o.x.from)))
    .sort((a, b) => (at(b.x) - at(a.x)) || (a.i - b.i))      // 新しい順。同じ日なら書いた順
    .map(o => o.x);
  const shown = started.filter(x => !x.to || now < new Date(x.to)).slice(0, NEWS_MAX);
  const past  = started.filter(x => shown.indexOf(x) < 0);
  return { shown, past };
}
function newsDay(s){
  const d = new Date(s);
  if (isNaN(d)) return "";
  return (d.getFullYear() !== nowDate().getFullYear() ? d.getFullYear() + "/" : "")
    + (d.getMonth() + 1) + "/" + d.getDate();
}
function newsSrc(x){
  if (!x.src && !x.url) return "";
  return '<span class="news-src">' + esc(x.src || "")
    + (x.url ? '<a href="' + esc(x.url) + '" target="_blank" rel="noreferrer">記事 ▶</a>' : "")
    + '</span>';
}
function newsArchHtml(past, open){
  if (!past.length) return "";
  const br = t => esc(t).replace(/\n/g, "<br>");
  return '<details class="news-arch"' + (open ? " open" : "") + '>'
    + '<summary>バックナンバー<span class="na-n">' + past.length + '件</span></summary>'
    + '<p class="na-note">月ちゃんが、ていねいにファイリングしております。</p>'
    + '<ul class="na-list">'
    + past.map(x => '<li class="na-row">'
        + '<span class="na-date">' + newsDay(x.from) + '</span>'
        + '<span class="na-main">'
        + '<span class="na-head min">'
        + (x.tag ? '<span class="na-tag">' + esc(x.tag) + '</span>' : "") + br(x.head) + '</span>'
        + '<span class="na-body">' + br(x.body || "") + newsSrc(x) + '</span>'
        + '</span></li>').join("")
    + '</ul></details>';
}
function newsHtml(open){
  const { shown, past } = pickNews();
  if (!shown.length && !past.length) return "";
  const br = t => esc(t).replace(/\n/g, "<br>");
  const bubble = shown.length
    ? '<b>ねあがりちゃん様</b>が走って<br>拾ってまいりました'
    : '<b>ねあがりちゃん様</b>は、ただいま<br>走って取材中でございます';
  return '<div class="news">'
    + '<span class="news-stamp min">月ちゃんニュース</span>'
    + '<span class="news-by"><span class="news-bubble">' + bubble + '</span><img src="' + CHARA_MOON + '" alt=""></span>'
    + (shown.length
      ? shown.map(x => '<div class="news-item">'
          + '<div class="news-row">'
          + (x.tag ? '<span class="news-tag">' + esc(x.tag) + '</span>' : "")
          + '<span class="news-title min">' + br(x.head) + '</span></div>'
          + '<span class="news-body">' + br(x.body || "") + newsSrc(x) + '</span>'
          + buyHtml(x, 1)
          + '</div>').join("")
      : '<p class="news-none">新しいニュースは、もう少々お待ちくださいませ。</p>')
    + newsArchHtml(past, open)
    + '</div>';
}

/* ══ 紙面をひらく ══
   画像がまだ置かれていないときは、ねあがりちゃんが「まだ届いてない」と言う */
let SHOWA_NOW = null, paperBack = null;
function paperPh(sub){
  return '<div class="paper-ph"><img src="' + CHARA_AD + '" alt="">'
    + '<b class="min">紙面が、まだ<br>印刷所から届いてません！</b>'
    + '<small>' + sub + '</small></div>';
}
function openPaper(i){
  const box = document.getElementById("paper");
  if (!box || !SHOWA_NOW) return;
  const isNext = i === "next";
  const r = isNext ? [SHOWA_NOW.next, "？？？", "", ""] : SHOWA_NOW.list[i];
  if (!r) return;
  const no = esc(r[0]), name = esc(r[1]);
  const url = String(r[2] || "").trim() || SHOWA_NOW.note;
  box.innerHTML = '<div class="paper-in">'
    + '<div class="paper-bar"><span class="no min' + (isNext ? " next" : "") + '">' + no + '</span>'
    + '<span class="t min">昭和のお値段 ' + name + '</span>'
    + '<button type="button" class="paper-close">とじる ×</button></div>'
    + (isNext ? paperPh('（次号を、お楽しみに！）')
              : '<img class="paper-img" alt="昭和のお値段 ' + no + ' ' + name + 'の紙面">')
    + (url
      ? '<a class="sw-note min" href="' + esc(url) + '" target="_blank" rel="noopener"><b>noteで つづきを読む ▶</b><small>（noteがひらきます）</small></a>'
      : '<span class="sw-note min wait">noteのつづきは、ただいま準備中…</span>')
    + (isNext ? "" : '<p class="paper-hint">指で広げると、大きく見られます</p>')
    + '</div>';
  const img = box.querySelector(".paper-img");
  if (img){
    img.onerror = () => {
      const t = document.createElement("div");
      t.innerHTML = paperPh('（もうすぐ届きます！）');
      img.replaceWith(t.firstChild);
    };
    img.src = String(r[3]).trim();
  }
  paperBack = document.activeElement;
  box.hidden = false;
  document.body.style.overflow = "hidden";
  const c = box.querySelector(".paper-close"); if (c) c.focus();
}
function closePaper(){
  const box = document.getElementById("paper");
  if (!box || box.hidden) return;
  box.hidden = true; box.innerHTML = "";
  document.body.style.overflow = "";
  if (paperBack && paperBack.focus) paperBack.focus();
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closePaper(); });

/* 広告欄。data.json に "ad" を書くとその内容に、なければ下の基本形になる。
   "ad": { "tag":"…", "head":"1行目\n2行目", "body":"…", "btn":"…", "url":"楽天のページ" } */
const AD_DEFAULT = {
  tag:  "ねあがりちゃん推薦",
  head: "値上げの前に\nまとめ買い",
  body: "毎日つかうものは、楽天市場で。ポイントもたまります。",
  btn:  "楽天市場をのぞく ▶",
  url:  "https://www.rakuten.co.jp/"
};
/* "ad" はいくつでも並べられる。from〜to の期間中のものだけ出て、
   どれにも当てはまらないときは基本形になる（期間が終われば自動で元に戻る） */
function pickAd(){
  let list = DATA && DATA.ad;
  if (!list) return {};
  if (!Array.isArray(list)) list = [list];
  const now = nowDate();
  return list.find(x => x &&
    (!x.from || now >= new Date(x.from)) &&
    (!x.to   || now <  new Date(x.to))) || {};
}
function untilText(to){
  const d = new Date(to);
  if (isNaN(d)) return "";
  return (d.getMonth()+1) + "月" + d.getDate() + "日 "
    + d.getHours() + ":" + String(d.getMinutes()).padStart(2,"0") + "まで";
}
function adHtml(){
  if (!AFF.RAKUTEN) return "";
  const pick = pickAd();
  const a = Object.assign({}, AD_DEFAULT, pick);
  const href = "https://hb.afl.rakuten.co.jp/hgc/" + AFF.RAKUTEN
    + "/?pc=" + encodeURIComponent(a.url) + "&link_type=text";
  const br = t => esc(t).replace(/\n/g, "<br>");
  return '<a class="koukoku" href="' + esc(href) + '" target="_blank" rel="sponsored noopener">'
    + '<span class="pr kk-mark">広告</span>'
    + '<span class="kk-in">'
    + '<span class="kk-tag min"><i>推</i>' + esc(a.tag) + '</span>'
    + '<span style="min-width:0"><span class="kk-head min" style="display:block">' + br(a.head) + '</span>'
    + '<span class="kk-body" style="display:block">' + br(a.body) + '</span>'
    + (pick.to ? '<span class="kk-until min">' + untilText(pick.to) + '</span>' : "")
    + '</span>'
    + '<img class="kk-chara" src="' + CHARA_AD + '" alt="">'
    + '<span class="kk-btn min">' + esc(a.btn) + '</span>'
    + '</span></a>';
}

function items(){
  if (!DATA) return [];
  return (DATA.items || [])
    .map(r => Object.assign({}, r, { d: parseDate(r.date) }))
    .filter(r => r.d && r.item && days(r.d) >= -31)
    .sort((a,b) => a.d - b.d);
}

function render(){
  const all = items();

  const u = parseDate(DATA && DATA.updated);
  const updText = u ? (u.getMonth()+1) + "月" + u.getDate() + "日 しらべ" : "";
  const n = all.filter(r => r.first_seen === (DATA && DATA.updated)).length;

  document.getElementById("newbar").innerHTML =
    '<div class="newbar">'
    + '<span class="nb-left min">'
    + (n > 0 ? "新しい値上げ " + n + " 件" : "今週のねあがり")
    + '</span><span class="upd dot" id="upd"></span>'
    + '<img class="bar-chara" src="' + CHARA_BAR + '" alt=""></div>';

  const updEl = document.getElementById("upd");
  updEl.dataset.text = updText;
  updEl.textContent = updText;
  if (dotReady && updText) mountDot(updEl, [updText], [15,92,101], 150, 1);

  /* しぼりこみを押すたびに描き直すので、バックナンバーが開いていたら開いたままにする */
  const newsEl = document.getElementById("news");
  const newsH = newsHtml(!!newsEl.querySelector(".news-arch[open]"));
  newsEl.innerHTML = newsH;
  const newsBuy = newsH.indexOf('class="buy"') >= 0;

  /* 昭和のお値段は最初の1回だけ作る（カテゴリを切りかえても、ひらいたままにするため） */
  const sw = document.getElementById("showa");
  if (sw && !sw.dataset.done){
    sw.innerHTML = showaHtml(); sw.dataset.done = "1";
    /* サイトのいちばん下にも、同じ提灯のボタン */
    const fs = document.getElementById("foot-shop");
    if (fs && SHOWA_NOW.home) fs.innerHTML = shopHtml(SHOWA_NOW.home, "ft", ["ねあがりチラシの作者", "“aurorapolis”のnote"], "いろんな記事を、営業中");
  }

  document.getElementById("cats").innerHTML = CATS.map(c =>
    '<button class="cat' + (c === CAT ? " on" : "") + '" data-cat="' + c + '">' + c + '</button>'
  ).join("")
    + (AFF.RAKUTEN ? '<button class="cat kattoku" data-go="koukoku">買っとく ▼</button>' : "");

  const inCat = all.filter(r => CAT === "すべて" || r.cat === CAT);
  const shown = inCat.filter(r => days(r.d) >= -7);
  const past  = inCat.filter(r => days(r.d) < -7).sort((a, b) => b.d - a.d);
  const body = document.getElementById("body");

  function archiveHtml(){
    if (!past.length) return "";
    const seen = {};
    let h = '<div class="arch-head">もう上がりました<span>ここ最近のやつ↓</span></div><div class="arch">';
    past.forEach(r => {
      h += '<div class="arch-row">'
         + '<span class="arch-date">' + (r.d.getMonth() + 1) + '/' + r.d.getDate() + '</span>'
         + '<span class="arch-name">' + esc(r.item)
         + '<span class="arch-maker">' + esc(r.maker) + '</span>'
         + '<span class="arch-src">出典 ' + esc(r.src)
         + (r.url && !seen[r.url] ? '<a href="' + esc(r.url) + '" target="_blank" rel="noreferrer">記事を読む</a>' : "")
         + '</span></span>'
         + '<span class="arch-rate">' + esc(r.rate) + '</span></div>';
      if (r.url) seen[r.url] = true;
    });
    return h + '</div>';
  }

  const ad = adHtml();
  const pn = document.getElementById("ad-note");

  /* セール期間中だけ、上に1行。押すと下の広告欄へ */
  const sale = pickAd();
  document.getElementById("sale-line").innerHTML = (ad && sale.head)
    ? '<button class="saleline" data-go="koukoku">'
      + '<span class="sl-now min">実施中！</span>'
      + '<span class="sl-name min">' + esc(sale.line || String(sale.head).replace(/\n/g, "")) + '</span>'
      + (sale.to ? '<span class="sl-until">〜' + (new Date(sale.to).getMonth()+1) + '/' + new Date(sale.to).getDate() + '</span>' : "")
      + '<span class="sl-go" aria-label="見に行く">▼</span>'
      + '<span class="pr">広告</span>'
      + '</button>'
    : "";

  if (!shown.length){
    body.innerHTML = (past.length
      ? '<p class="empty">これから上がるものは<br>いまのところありません。</p>' + archiveHtml()
      : '<p class="empty">このカテゴリの値上げは、<br>いまのところありません。</p>') + ad;
    if (pn) pn.hidden = !(ad || newsBuy);
    return;
  }

  const groups = new Map();
  shown.forEach(r => {
    if (!groups.has(r.date)) groups.set(r.date, []);
    groups.get(r.date).push(r);
  });

  const seenUrl = {};        // 同じ記事へのリンクは最初の1回だけ出す
  let anyBuy = false;

  let html = "";
  groups.forEach((rows, date) => {
    const d = parseDate(date), k = days(d);
    html += '<section><div class="daterow' + (k <= 7 ? " soon" : "") + '">'
      + '<span class="dnum min">' + (d.getMonth()+1) + "/" + d.getDate() + '</span>'
      + '<span class="dwd">' + WD[d.getDay()] + '曜</span>'
      + '<span class="when min">' + whenLabel(k) + '</span>'
      + '</div><div class="list">';

    rows.forEach((r, i) => {
      const isNew = r.first_seen === DATA.updated;
      const unsure = r.sure === false;
      const buy = buyHtml(r, k);
      if (buy) anyBuy = true;
      html += '<div class="item"><div class="row">'
        + '<span style="flex:1;min-width:0">'
        + '<span class="name">' + esc(r.item)
        + (isNew ? '<span class="tag-new min">NEW</span>' : "")
        + (unsure ? '<span class="tag-unsure">発表待ち</span>' : "")
        + '</span><span class="maker">' + esc(r.maker) + '</span>'
        + (r.note ? '<span class="note">' + esc(r.note) + '</span>' : "")
        + (r.ex ? '<span class="ex"><b>例</b>' + exHtml(r.ex) + '</span>' : "")
        + '<span class="srcline">出典 ' + esc(r.src)
        + (r.url && !seenUrl[r.url] ? '<a href="' + esc(r.url) + '" target="_blank" rel="noreferrer">記事を読む</a>' : "")
        + '</span>'
        + buy
        + '</span>'
        + '<span class="rate min' + (unsure ? " soft" : "") + '">'
        + esc(r.rate) + (unsure ? "?" : "") + '</span></div>';

      if (r.url) seenUrl[r.url] = true;
      html += '</div>';
    });
    html += '</div></section>';
  });
  body.innerHTML = html + ad + archiveHtml();

  /* 広告が1つでも出ているときだけ、上に説明を出す */
  if (pn) pn.hidden = !(anyBuy || ad || newsBuy);
}

document.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  /* 昭和のお値段：其の○を押すと紙面がひらく／とじるボタンか、まわりの暗いところでとじる */
  const pp = e.target.closest("[data-paper]");
  if (pp){ openPaper(pp.dataset.paper === "next" ? "next" : +pp.dataset.paper); return; }
  if (e.target.closest(".paper-close") || e.target.id === "paper"){ closePaper(); return; }
  /* 「買っとく」タブ：下の広告欄までスクロールして、ちょっと揺らす */
  if (e.target.closest("[data-go]")){
    const k = document.querySelector(".koukoku");
    if (k){
      k.scrollIntoView({ behavior:"smooth", block:"center" });
      k.classList.remove("yure");
      setTimeout(() => { void k.offsetWidth; k.classList.add("yure"); }, 550);
    }
    return;
  }
  const c = e.target.closest(".cat");
  if (c){ CAT = c.dataset.cat; render(); }
});
